# claims.yaml —— 上墙数字的唯一出处（评审强制：README/EVIDENCE/deck 只准从这里抄）
#
# 每条记录 = 一句对外宣称 + 它在仓内的硬出处 + 期望值。`bench/train/assert_claims.py`
# 逐条断言，任一不符即非零退出；`tests/test_claims.py` 把它挂进 pytest。
# 规矩：宁可不写，不可写错——写不出条目的句子就不许出现在任何对外材料里。
#
# kind:
#   json     —— 读 JSON，按点号选择器取值（列表用 [i]）
#   linecount—— 数文件行（可选 equals=每行必须同为该字符串）
#   computed —— 调 assert_claims.COMPUTED[<fn>] 现场算（行数/标记计数等）
#   runtime  —— 运行时采集，只断言 >= floor（如 pytest 条数，不写死）
# 可选 tie: 该条目在对外材料中的用法注释（不参与断言）

