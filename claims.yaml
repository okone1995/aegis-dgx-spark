# —— Spark 侧 judge 单发时延与跨机判读一致性（2026-09-25 实跑，bf16 未量化路径）——
# 口径纪律：本组数字只说 batch=1 单发 + transformers bf16 合并权重；
# 5090 的 18.5ms/条是批量口径，两者不同句、不换算、不称"GGUF"。

- claim_id: spark_judge_median_ms
  clause: "judge 在 Spark 单发（batch=1）中位时延 73.6 ms"
