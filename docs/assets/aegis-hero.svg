    <radialGradient id="glow"><stop stop-color="#4fd8d0" stop-opacity=".16"/><stop offset="1" stop-color="#4fd8d0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="380" rx="22" fill="url(#bg)"/>
  <circle cx="1060" cy="190" r="260" fill="url(#glow)"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
