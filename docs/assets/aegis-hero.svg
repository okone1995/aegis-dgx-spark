      <circle cx="24" cy="60" r="9" fill="#ff797d"/><circle cx="255" cy="62" r="9" fill="#75aef6"/><circle cx="140" cy="265" r="9" fill="#66e0d3"/>
      <text x="140" y="309" fill="#cce2ed" font-size="17" font-weight="700" text-anchor="middle">发现 → 修补 → 验证 → 学习</text>
